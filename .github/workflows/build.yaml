name: APK derle

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # DUZELTME 2: Gradle projesinin (settings.gradle) hangi klasorde oldugunu kendisi bulur.
      # Dosyalar depoda bir alt klasore yuklenmisse de calisir.
      - name: Proje klasorunu bul
        id: proj
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "settings.gradle depoda bulunamadi. Depo icerigi:"
            ls -la
            exit 1
          fi
          d=$(dirname "$f")
          echo "Proje klasoru: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # DUZELTME 1: setup-android varsayilan olarak kaldirilmis "tools" paketini
      # kurmaya calisip cokuyordu.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: SDK ve NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Derle
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: vk640-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/*.apk
